<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">

    <style>
        body {
            background-image: url('https://t4.ftcdn.net/jpg/02/92/20/37/360_F_292203735_CSsyqyS6A4Z9Czd4Msf7qZEhoxjpzZl1.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            height: 100vh;
            margin: 0;
        }

        .card img {
            height: 180px;
            object-fit: cover;
            border-radius: 10%;
        }

        .card {
            background-color: black;
            border-radius: 10%;
            transition: transform 0.3s;
            width: 20rem; /* Default card width */
        }

        .card:hover {
            transform: scale(1.05);
        }

        .container-center {
            height: 100%;
        }

        /* Adjust width for smaller screens */
        @media (max-width: 575px) {
            .card {
                width: 90%; /* Full width on smaller screens */
            }
        }

        /* Adjust width for laptop screens */
        @media (min-width: 1024px) and (max-width: 1440px) {
            .card {
                width: 25rem; /* Increased width for laptop-sized screens */
            }
        }
    </style>
</head>

<body>
    <div class="container container-center d-flex justify-content-center align-items-center">
        <div class="row justify-content-center g-5">
            <!-- Admin Login Card -->
            <div class="col-12 col-sm-6 col-lg-4 d-flex justify-content-center">
                <div class="card text-center">
                    <a href="./loginAsAdmin.html" class="text-decoration-none">
                        <img src="https://i.pinimg.com/736x/6a/44/f0/6a44f0e35b10e6ed063eeebf7ed844f9.jpg" class="card-img-top" alt="Login As Admin">
                        <div class="card-body">
                            <p class="card-text fs-5 text-white">Login As Admin</p>
                        </div>
                    </a>
                </div>
            </div>
            <!-- Customer Login Card -->
            <div class="col-12 col-sm-6 col-lg-4 d-flex justify-content-center">
                <div class="card text-center">
                    <a href="./signUpAsCustomer.html" class="text-decoration-none">
                        <img src="https://cdn.vectorstock.com/i/500p/56/65/returning-client-icon-customers-interaction-vector-31005665.jpg" class="card-img-top" alt="Login As Customer">
                        <div class="card-body">
                            <p class="card-text fs-5 text-white">Login As Customer</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
</body>

</html>
